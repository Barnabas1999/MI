name: Build Mi APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip
          pip install buildozer cython==0.29.33
      - name: Build APK
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          buildozer android debug || true
          SDKMGR=$(find $SDK -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMGR" ]; then SDKMGR=$(which sdkmanager); fi
          mkdir -p $SDK/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1051866b74d9b" > $SDK/licenses/android-sdk-license
          echo "601085b94cd77f0b54ff86406957099faeb8b504" > $SDK/licenses/android-sdk-preview-license
          yes | $SDKMGR --sdk_root=$SDK --licenses || true
          $SDKMGR --sdk_root=$SDK "build-tools;33.0.2" "build-tools;37.0.0" || true
          # Real build - save ALL output
          set -o pipefail
          buildozer --log-level 2 android debug > $GITHUB_WORKSPACE/full_log.txt 2>&1 || true
          echo "--- LAST 200 LINES ---"
          tail -n 200 $GITHUB_WORKSPACE/full_log.txt
          echo "--- ERRORS ---"
          grep -i "error\|exception\|failed" $GITHUB_WORKSPACE/full_log.txt | tail -n 100 || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: full_log.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-apk
          path: bin/*.apk
