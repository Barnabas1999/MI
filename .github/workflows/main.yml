name: Build Mi APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip
          pip install buildozer cython==0.29.33

      - name: Fix AIDL - Install Build Tools 33 and 37
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          # Accept all licenses on main SDK
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platform-tools" || true

          # First buildozer run to create its own SDK
          buildozer android debug || true

          # NOW accept license inside buildozer's OWN SDK - THIS IS THE KEY FOR AIDL
          echo "Accepting license inside buildozer SDK..."
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" || true

          ls ~/.buildozer/android/platform/android-sdk/build-tools/ -lh
          echo "AIDL path:"
          find ~/.buildozer -name aidl -type f

      - name: Second Build - Real APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-apk
          path: bin/*.apk
